default:
  name: standard-thai-novel
  description: Neutral polished Thai prose that preserves source meaning.
  genre_label: general fiction
  tone: neutral, clean, readable
  naming_notes: Keep names natural and consistent with the glossary.
  narration_density: balanced
  glossary_categories:
    - character
    - location
    - organization
    - item
    - term
  qa_criteria:
    - Faithful meaning
    - Natural Thai prose
    - Stable glossary usage
    - Clear sentence flow

dark_fantasy:
  name: dark-fantasy-thai
  description: Gloomy Thai prose for dark fantasy settings.
  genre_label: dark fantasy
  tone: eerie, heavy, atmospheric, ominous
  naming_notes: Keep names sharp and grounded; avoid heroic register.
  narration_density: moderate
  glossary_categories:
    - character
    - location
    - item
    - supernatural
    - term
  qa_criteria:
    - Preserve menace
    - Keep the mood bleak
    - Avoid brightening the tone
    - Keep terminology consistent

xianxia_wuxia:
  name: xianxia-wuxia-thai
  description: Mythic martial-arts and cultivation prose with controlled grandeur.
  genre_label: xianxia wuxia
  tone: elevated, martial, mythic, energetic
  naming_notes: Preserve sects, realms, techniques, and honorifics consistently.
  narration_density: moderate
  glossary_categories:
    - character
    - sect
    - realm
    - technique
    - artifact
    - location
  qa_criteria:
    - Keep cultivation terms intact
    - Preserve martial cadence
    - Avoid modern slang
    - Keep honorifics stable

xianxia:
  name: xianxia-wuxia-thai
  description: Legacy alias for xianxia_wuxia.
  genre_label: xianxia wuxia
  tone: elevated, martial, mythic, energetic
  naming_notes: Preserve sects, realms, techniques, and honorifics consistently.
  narration_density: moderate
  glossary_categories:
    - character
    - sect
    - realm
    - technique
    - artifact
    - location
  qa_criteria:
    - Keep cultivation terms intact
    - Preserve martial cadence
    - Avoid modern slang
    - Keep honorifics stable

modern_urban:
  name: modern-urban-thai
  description: Contemporary Thai prose for urban, workplace, or city-based fiction.
  genre_label: modern urban
  tone: contemporary, direct, vivid, grounded
  naming_notes: Keep modern names and titles natural; avoid archaic phrasing.
  narration_density: balanced
  glossary_categories:
    - character
    - location
    - organization
    - item
    - term
  qa_criteria:
    - Keep modern register
    - Preserve character voice
    - Avoid antiquated diction
    - Keep references readable

sci_fi:
  name: sci-fi-thai
  description: Clean Thai prose for science fiction, technology, and future settings.
  genre_label: science fiction
  tone: precise, curious, technical, forward-looking
  naming_notes: Preserve technical terms and invented names consistently.
  narration_density: moderate
  glossary_categories:
    - character
    - location
    - organization
    - device
    - term
  qa_criteria:
    - Keep technical meaning accurate
    - Preserve worldbuilding terms
    - Avoid fantasy-cultivation diction
    - Keep exposition readable

horror:
  name: horror-thai
  description: Tight, unsettling Thai prose for horror and suspense.
  genre_label: horror
  tone: tense, unsettling, claustrophobic, ominous
  naming_notes: Keep names crisp; avoid softening dread or suspense.
  narration_density: compact
  glossary_categories:
    - character
    - location
    - item
    - supernatural
    - term
  qa_criteria:
    - Preserve dread
    - Avoid comic relief unless present in source
    - Keep imagery sharp
    - Maintain suspense

romance_drama:
  name: romance-drama-thai
  description: Emotional Thai prose for romance, family, and character drama.
  genre_label: romance drama
  tone: warm, emotional, intimate, reflective
  naming_notes: Keep names gentle and natural; preserve relationship nuance.
  narration_density: balanced
  glossary_categories:
    - character
    - relationship
    - location
    - item
    - term
  qa_criteria:
    - Preserve emotional beats
    - Keep character relationships clear
    - Avoid melodramatic overload
    - Maintain consistent names

deep_sea_embers:
  name: deep-sea-embers-thai
  description: >
    Nautical dark fantasy style for Deep Sea Embers.
    Eerie, maritime, post-collapse atmosphere with ghost-ship and fog motifs.
    Thai prose is controlled, slightly ominous, and readable.
    Preserves dry/deadpan humor when present in source.
    Avoids wuxia/xianxia/cultivation diction entirely.
  genre_label: dark fantasy
  tone: eerie, mysterious, atmospheric, subtly ominous
  naming_notes: Keep ship and place names consistent; preserve natural Thai pronouns; avoid Thai-ifying names.
  narration_density: moderate
  glossary_categories:
    - character
    - location
    - ship
    - supernatural
    - item
    - term
  qa_criteria:
    - Preserve maritime dread
    - Keep prose restrained
    - Avoid cultivation diction
    - Preserve dry humor
    - Keep glossary terms stable
