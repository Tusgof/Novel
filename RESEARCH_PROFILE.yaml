synopsis: >
  A man awakens as the captain of the ghost ship Vanished and is forced to navigate
  a fractured world of endless seas, fog-bound city-states, and old anomalies left
  behind by a collapsed order. While keeping the ship, its crew, and his borrowed
  identity from spiraling out of control, he investigates the hidden history of a
  civilization that is still being watched from the deep.
