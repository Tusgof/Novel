style_notes: >
  The novel blends maritime dread, dry humor, practical reasoning, and restrained
  emotional warmth. Keep the prose steady and atmospheric. Avoid xianxia diction,
  melodramatic romance framing, or slangy comedy that breaks the eerie tone.
reader_expectations: >
  Readers expect a slow-burn mystery with layered worldbuilding, a rational lead,
  creeping supernatural danger, and recurring contrast between uncanny horror and
  humane crew/found-family warmth.
review_summary: >
  External summaries and reviews consistently highlight the fog-drowned sea setting,
  ghost-ship hook, strong worldbuilding, measured pacing, and a mix of cosmic-horror
  atmosphere with humor and character warmth. Commentary about the author's craft
  also emphasizes a more mature, steadier tone than his earlier lighter work.
