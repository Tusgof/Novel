name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hermetic:
    # Playwright 1.60 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the declared package and dependencies
        run: python -m pip install -e .

      - name: Routing and adapter tests
        run: python -m unittest test_workspace_routing test_xszj_adapter test_wetriedtls_adapter test_toonnovel_adapter test_source_state_readiness test_opencode_provider test_kit_adoption test_governance test_semantic_detection -v

      - name: Governance budgets, reader snapshot, and escaped-defect ledger
        run: python scripts/workspace_health.py check

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: MoonRead/package-lock.json

      - name: Scoped reader generation and translation-label regressions
        working-directory: MoonRead
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:generate

      - name: Reader production build and persisted-state regressions
        working-directory: MoonRead
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npx playwright install --with-deps chromium
          npm run lint
          npm run build
          npm run test:reader

      - name: Worker envelope tests
        working-directory: scripts
        run: python -m unittest test_validate_herdr_envelope -v

      - name: Deep Sea Embers pipeline tests
        working-directory: Deep Sea Embers
        run: python test_translation.py
