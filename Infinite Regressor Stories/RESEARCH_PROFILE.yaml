style_notes: 'Contemporary first-person regression/apocalypse fiction. Thai should stay readable, dry, and reflective, preserving deadpan humor and fatigue from repeated failed loops. Avoid cultivation/wuxia register unless the source explicitly invokes genre parody.'
reader_expectations: 'Readers expect clever regression premise deconstruction, accumulated trauma from many loops, apocalypse survival, character stories, and dry humor rather than simple power fantasy wish fulfillment.'
