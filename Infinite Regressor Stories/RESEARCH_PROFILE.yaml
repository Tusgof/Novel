synopsis: '[The Infinite Regression Genre] Look in any fantasy novel, and you’ll find that regression is a guaranteed cheat code. The protagonist dies, returns before death, and keeps trying until every bad ending becomes a happy ending. But the narrator, a man with 1,183 runs of experience, calls that myth vile propaganda. This is not a success story; it is a story about the aftermath of failures.'
