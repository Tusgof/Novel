synopsis: >
  Soren Valmere never awakened an Authority, so his family counts him as a dud and
  marries him off as a discard. His bride is Ethea Morvain, the Ice Empress, left
  paralysed by a Gate incident and pushed out by her own family. On their first
  night the awakening he had given up on finally arrives: an Investment Authority
  that reads people, risk and sacrifice, then pays out "returns" when he spends
  himself on someone else's behalf.
  What follows is a slow climb rather than a power fantasy. Soren earns a hunter
  licence, joins a party, raids gates, registers with the awakening bureau, sits
  promotion exams and starts building a name, while Ethea rebuilds her own strength
  beside him. The pressure widens from family politics and a contested surname to a
  gate where Ethea's survival is the stake, ownership of a monolith anomaly he has
  to negotiate for, the Apocalypse Dawn syndicate, and finally a hidden organisation
  called the Zero Circle. The last stretch of the book is a farewell: the couple
  leaves the country they built their life in and sets out somewhere new.
