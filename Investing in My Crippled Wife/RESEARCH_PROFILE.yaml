style_notes: >
  Third-person limited on Soren. Narration is carried by "he" (5,229 hits) against
  "she" (1,896) and "I" (2,470); first person appears only inside speech or marked
  thoughts, so a Thai draft must not drift into first-person narration.
  Thoughts and dialogue are visually separate: inner monologue sits in '...' single
  quotes (8.8% of paragraphs) and spoken lines in "..." (21.3%). Keep that
  distinction instead of flattening both into plain prose.
  Paragraphs are short - median 15 words, 90th percentile 45, maximum 133 - so do
  not merge them into long Thai blocks.
  System output is set apart as bracketed lines ([Investment detected.],
  [Returns granted:], [Calculating returns...], [Ding!]) and as status screens made
  of "Label: value" lines (Name, Status, Rank, Potential, Mental State, Investment
  Value, Current Mana Level) separated by rows of '=' or box-drawing bars. Keep
  those blocks out of narrative sentences and keep their labels stable.
  Ranks are "Nth Circle" and the source mixes spelled and numeric forms (First and
  1st, Eighth and 8th, 7th Circle); choose one Thai form and hold it.
  Register is Western-modern: Mr./Miss/Sir are common (111/38/52 hits) and there is
  no -ssi, hyung or oppa honourific system, so do not import Korean-style address.
  Profanity is mild and sparse (damn 24, hell 15, shit 3, fuck 1); do not roughen it
  into the coarser voice used by other titles in this workspace.
reader_expectations: >
  Clear Thai modern-fantasy prose, readable ability and status text, and a
  relationship that grows through care rather than sudden devotion. Readers should
  get the "investment" idea as a system metaphor, not as stock or finance jargon.
  Do not pity Ethea's disability, invent extra lore, or change the narrator's
  distance from the couple.
