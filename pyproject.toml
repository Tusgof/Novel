[project]
name = "novel-workspace-pipeline"
version = "0.2.0"
description = "Shared multi-novel translation pipeline"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
novel-pipeline = "novel_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["novel_pipeline*"]
