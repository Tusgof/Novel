notes: >
  Terms above are candidates observed in the fetched source or shared across public
  listings, not approved glossary entries; approve them through the glossary gate before
  translation. The separately landed primary source report records ch001-ch082
  free chapters (1,055,669 characters) after owner-authorized wetriedtls fetch;
  ch083 onward returned a locked shell, not a usable chapter body or adapter defect.
  Preserve that source-access evidence. The isolated Code order imported only its
  requested ch001-ch060 subset with byte parity. A standalone "?????" source line
  is recorded in ch055/ch059/ch082 as an authored confusion beat; do not infer
  broader source or translation authority from availability. Local runtime may be
  unavailable in a clean checkout; use observed status rather than inventing it.
  Arcs in the fetched range run: wastrel origin (ch001-ch003), gutter life (ch004-ch008),
  second run (ch009-ch011), work and rifts (ch012-ch020), The Eight-Foot Widow and Ceres
  (ch021-ch024), Project Z through Build: Necromancer (ch025-ch033), fixer jobs and Save
  Point (ch034-ch038), then Premium Fever (ch039-ch040). 26 of 40 chapter titles carry a
  multi-part (n) suffix. ch007 holds one Hangul token inside an explicit Footnotes block
  that must stay distinguishable from prose. Alternative English titles render ch001 as
  "I Became the Count's Scoundrel" while our source says "I Became the Wastrel of a
  Count's House"; keep one canonical Thai handling. Because readers place the stronger
  material after roughly chapter 40, a ch001-ch003 pilot tests mechanics and voice but
  not the story at its best. The corrected first-forty Code products and their
  scoped local reader now pass independent gates; public deployment and owner-
  approved landing remain separate from source access or local generation.
