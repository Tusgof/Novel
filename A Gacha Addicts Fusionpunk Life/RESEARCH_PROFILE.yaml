style_notes: >
  First-person male voice, profane, self-mocking, and openly mercenary; do not soften
  insults, cursing, or his callous decisions into polite Thai. Roughly one paragraph
  in four opens with dialogue, so keep speaker turns crisp and never merge them into
  narration. System output, draw results, and quest lines appear as their own bracketed
  blocks and must stay separate from prose. Keep Grade, Rank, currency, item, district,
  and project names stable and distinct from ordinary nouns. Gacha ritual language and
  pull-count jokes should read as gambling slang, not as poetry. The source is an
  English relay of a Korean original, so transliterations already used in the source
  win over new inventions, and translator footnotes explaining Korean wordplay must
  stay visibly detached from the story. Part titles repeat across multi-part chapters
  ending in (n); the episode number, not that suffix, is the chapter number.
reader_expectations: >
  Faithful, natural Thai with stable names and readable dialogue and system blocks;
  public MoonRead reading for ch001-ch040 only after the owner-authorized gates.
review_summary: >
  Bibliography confirmed: Korean original on Novelpia, English official on Novelpia
  Global, and multiple fan translations. Country-of-origin status is ongoing at around
  258 chapters, and the author also wrote City of Witches. Reader reception is split
  rather than poor: NovelUpdates shows 4.0/5 from 61 votes with a heavy cluster of top
  scores alongside a visible low-score cluster. Recurring praise covers planned arcs, a
  coherent power system, and unexpectedly deep side characters; recurring criticism
  covers a slow opening and the protagonist's early callous acts, especially selling
  Arbel's body. The most consistent reader warning is that the story only settles
  several chapters in and reads much better after roughly chapter 40, which matches the
  arc titles in our fetched range. Reviews were used for orientation only; every plot
  claim in this profile was re-checked against our own fetched source.
