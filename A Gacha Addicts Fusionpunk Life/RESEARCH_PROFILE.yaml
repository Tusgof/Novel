synopsis: >
  Cedric Montraven is the disgraced son of Count Montraven's house, a wastrel whose
  older sister Arbel is the family's real talent and a First Rank mage. He is also a
  gambling and gacha addict. When his original body dies mid-pull, he wakes in
  Cedric's place and is promptly abandoned through a magic device into Necropolis, an
  orphan city where Black Dust, rifts, and corporate blocs set the rules and where
  your address decides your class. His only edge is regression: death returns him to
  a save point with his memories intact. He spends that edge like a gacha player,
  trading points and Universal Coins for random boxes to assemble a necromancer
  build. The first run goes badly, with Arbel dead and her body sold to fund more
  pulls, and it drags him into the orbit of Ceres Cassian, the executive everyone
  calls Mama Ceres. On the second run he becomes her driver, saves Arbel, and is
  pulled into Project Z, rift expeditions such as the Hotel Abyss and the Mushroom
  Factory, and finally a system order that puts both Ceres and Arbel on his kill list.
