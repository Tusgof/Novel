novel_id: deep-sea-embers
pipeline_engine: lean
vault_root: .
source_language: zh
default_batch_size: 10
chapter_unit: chapters
default_style_profile: deep_sea_embers

glossary:
  curated_options:
    周铭: [โจวหมิง, โจว หมิง, คุณโจวหมิง]
    浓雾: [หมอกหนาทึบ, ม่านหมอกหนา, หมอกเข้มข้น]
    雾气: [ไอหมอก, ละอองหมอก, หมอกบาง]
    日记: [บันทึกประจำวัน, สมุดบันทึก, ไดอารี]
    镜子: [กระจก, บานกระจก, คันฉ่อง]

chunking:
  chinese_character_limit: 600
  non_chinese_word_limit: 5000

execution:
  concurrency_enabled: false
  stop_on_first_hard_failure: true
  stage_concurrency:
    translating: 2
    refining: 2
    qa: 1
    formatting: 2
  artifact_cache:
    mode: report_only
    stages:
      - title_translation
      - term_suggestion
      - translating
  pre_qa_guardrail:
    mode: report_only
    dense_paragraph_warning_chars: 900
  sentinel:
    mode: blocking
    fail_on: major

source:
  adapter: piaotia
  toc_url: https://www.piaotia.com/html/15/15218/
  delay_seconds: 1.0
  encoding: gbk
